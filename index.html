<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YZ Tycoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Yapay Zekâ Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tektur:wght@500;700;800&display=swap">
<style>
  /* ===== Yapay Zekâ Tycoon — "laboratuvar HUD'u" tasarım sistemi =====
     Kararlar: (1) köşeler yuvarlak değil, 45° kesik (clip-path); (2) kart yerine çizgiyle ayrılmış satırlar;
     (3) sayılar eş aralıklı yazı (IBM Plex Mono), başlıklar Tektur, gövde IBM Plex Sans (Arapça: Plex Sans Arabic);
     (4) iki vurgu: aqua = veri/üretim, amber = satın alma. Magenta yalnız tehlike ve Karanlık Mod.
     (5) Tek ekran: sayfa kaymaz; yalnız alttaki panel kendi içinde kayar. Parlama sadece koyu temada ve statik. */
  :root {
    --bg: #E6EBEE; --bg2: #F2F5F7; --surface: #FFFFFF; --surface-2: #E9EFF2; --line: #C2CDD5; --line-hi: #8FA3B1;
    --fg: #0B141B; --muted: #4F606D; --ink: #0B141B; --edge: #A7B8C4; --screen: #0B141B; --eye: #2EF2D6;
    --teal: #00796B; --sun: #A85F00; --coral: #C8264C; --grape: #5B43D1; --sky: #0A6FBF; --pink: #B02F82; --lime: #3A7F12;
    --brain: #D6E0E6; --brain-line: #4F6A7B; --brain-f: #00796B; --brain-h: #C8264C; --virus: #D11F45; --on: #FFFFFF; --glow: transparent;
    --scrim: rgba(8, 14, 20, .55); --is-dark: 0;
    --display: 'Tektur', 'IBM Plex Sans', system-ui, sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --cut: 9px;
    --gridline: rgba(11, 20, 27, .05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #05080B; --bg2: #0A0F14; --surface: #0E151C; --surface-2: #131D26; --line: #1C2A35; --line-hi: #2E4455;
      --fg: #DCE7ED; --muted: #7C909E; --ink: #03060A; --edge: #1E3845; --screen: #02060A; --eye: #2EF2D6;
      --teal: #2EF2D6; --sun: #FFB23F; --coral: #FF4F7B; --grape: #9C82FF; --sky: #4CB8FF; --pink: #FF7AD1; --lime: #A6FF5C;
      --brain: #0A141C; --brain-line: #3F6475; --brain-f: #2EF2D6; --brain-h: #FF4F7B; --virus: #FF3B5C; --on: #03121A; --glow: rgba(46, 242, 214, .35);
      --scrim: rgba(0, 3, 6, .74); --is-dark: 1; --gridline: rgba(46, 242, 214, .035);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #05080B; --bg2: #0A0F14; --surface: #0E151C; --surface-2: #131D26; --line: #1C2A35; --line-hi: #2E4455;
    --fg: #DCE7ED; --muted: #7C909E; --ink: #03060A; --edge: #1E3845; --screen: #02060A; --eye: #2EF2D6;
    --teal: #2EF2D6; --sun: #FFB23F; --coral: #FF4F7B; --grape: #9C82FF; --sky: #4CB8FF; --pink: #FF7AD1; --lime: #A6FF5C;
    --brain: #0A141C; --brain-line: #3F6475; --brain-f: #2EF2D6; --brain-h: #FF4F7B; --virus: #FF3B5C; --on: #03121A; --glow: rgba(46, 242, 214, .35);
    --scrim: rgba(0, 3, 6, .74); --is-dark: 1; --gridline: rgba(46, 242, 214, .035);
    color-scheme: dark;
  }
  :root[lang="ar"] { --display: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; --body: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--fg); font: 400 14.5px/1.45 var(--body);
    background-color: var(--bg);
    background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lbl { font: 600 10.5px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  :root[lang="ar"] .lbl { letter-spacing: 0; font-family: var(--body); font-size: 12px; }
  .cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }

  /* Düğmeler: kesik köşe, dolgu yalnız birincil işte */
  .btn {
    appearance: none; border: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    transition: filter .1s, transform .08s;
  }
  .btn:not(:disabled):active { transform: translateY(1px); filter: brightness(1.15); }
  .btn:disabled { cursor: not-allowed; }

  /* ===== İskelet: tek ekran ===== */
  .app {
    height: 100vh; height: 100dvh; max-width: 1240px; margin: 0 auto;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 0;
    display: grid; gap: 6px;
    grid-template-rows: auto auto minmax(0, clamp(236px, 41dvh, 440px)) minmax(0, 1fr);
    grid-template-areas: "hud" "ticker" "stage" "side";
  }
  .hud { grid-area: hud; min-width: 0; }
  .ticker { grid-area: ticker; }
  .stage { grid-area: stage; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .side { grid-area: side; min-height: 0; display: flex; flex-direction: column; }
  .panels { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 2px 12px; scrollbar-width: thin; }
  .tabs { order: 2; }

  /* Üst gösterge */
  .hud-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .res { display: grid; min-width: 0; }
  .res strong { font: 600 clamp(30px, 9vw, 44px)/1 var(--mono); letter-spacing: -.03em; color: var(--teal); text-shadow: 0 0 18px var(--glow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rate { font-size: 14px; font-weight: 500; color: var(--muted); }
  .hud-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pills, .pills-in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .pill { font: 600 10.5px/1 var(--mono); letter-spacing: .06em; padding: 4px 6px; color: var(--on); background: var(--coral); }
  .pill.insp { background: var(--grape); }
  .pill.buff { background: var(--pink); }
  .gear { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .gear svg { width: 22px; height: 22px; }
  .tierline { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; overflow: hidden; }
  .tiername { font: 700 13px/1.1 var(--display); letter-spacing: .02em; white-space: nowrap; }
  .chip { font: 600 10.5px/1 var(--mono); padding: 3px 6px; white-space: nowrap; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-hi); overflow: hidden; text-overflow: ellipsis; max-width: 44vw; }
  .chip.align-f { color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
  .chip.align-h { color: var(--coral); box-shadow: inset 0 0 0 1px var(--coral); }
  :root[lang="ar"] .chip, :root[lang="ar"] .pill { font-family: var(--body); letter-spacing: 0; font-size: 11.5px; }
  .track { height: 8px; background: var(--surface-2); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--teal); box-shadow: 0 0 10px var(--glow); transition: width .4s; }
  .track.thin { height: 3px; margin-top: 5px; }
  .tiernext { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Haber bandı */
  .ticker { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 6px 10px; border: 0; background: var(--bg2); box-shadow: inset 2px 0 0 var(--teal); text-align: start; cursor: pointer; font: 500 12.5px/1.3 var(--body); color: var(--fg); }
  :root[dir="rtl"] .ticker { box-shadow: inset -2px 0 0 var(--teal); }
  .tk-dot { flex: none; width: 7px; height: 7px; background: var(--muted); }
  .tk-dot.live { background: var(--pink); box-shadow: 0 0 8px var(--pink); }
  .tk { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== Beyin sahnesi ===== */
  .brain-wrap { position: relative; flex: 1; min-height: 0; background: var(--bg2); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  .brain-wrap::before, .brain-wrap::after { content: ""; position: absolute; width: 16px; height: 16px; pointer-events: none; border-color: var(--line-hi); border-style: solid; }
  .brain-wrap::before { top: 4px; right: 4px; border-width: 1px 1px 0 0; }
  .brain-wrap::after { bottom: 4px; left: 4px; border-width: 0 0 1px 1px; }
  .brain-btn { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .brain-btn canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
  .shake { animation: shake .18s linear; }
  @keyframes shake { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
  .ovl { position: absolute; pointer-events: none; font: 600 11.5px/1 var(--mono); padding: 4px 7px; background: color-mix(in srgb, var(--bg) 78%, transparent); color: var(--fg); }
  .ovl.stats { top: 8px; inset-inline-start: 10px; display: grid; gap: 3px; color: var(--muted); background: none; padding: 0; }
  .ovl.stats span:first-child { color: var(--fg); }
  .tapnote { top: 8px; inset-inline-end: 10px; color: var(--teal); }
  .combo { top: 42px; inset-inline-start: 10px; display: flex; align-items: center; gap: 6px; }
  .combo .cbar { width: 42px; height: 5px; background: var(--surface-2); overflow: hidden; }
  .combo .cbar i { display: block; height: 100%; width: 0; background: var(--sun); }
  .combo.hot { color: var(--on); background: var(--sun); }
  .mghud { top: 8px; left: 50%; transform: translateX(-50%); color: var(--on); background: var(--sun); }
  .fab { position: absolute; top: 34px; inset-inline-end: 10px; display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; background: var(--grape); color: var(--on); font: 700 11.5px/1.1 var(--display); max-width: 55%; }
  .fab svg { width: 16px; height: 16px; flex: none; }
  .fab:disabled { background: var(--surface-2); color: var(--muted); }
  .packet { position: absolute; z-index: 3; width: 52px; height: 52px; padding: 0; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--on); background: var(--pk, var(--sun)); box-shadow: 0 0 22px color-mix(in srgb, var(--pk, var(--sun)) 60%, transparent); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); animation: bob 1.1s ease-in-out infinite; }
  .packet.gift { --pk: var(--teal); }
  .packet svg { width: 28px; height: 28px; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .editbar { position: absolute; top: 6px; left: 6px; right: 6px; z-index: 4; display: grid; gap: 6px; padding: 8px 10px; background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: inset 0 0 0 1px var(--teal); font-size: 12.5px; font-weight: 500; }
  .editbar .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .nero { position: absolute; bottom: 6px; inset-inline-start: 6px; inset-inline-end: 6px; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; }
  .mascot { pointer-events: auto; flex: none; width: 50px; height: 52px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mascot svg { width: 100%; height: 100%; overflow: visible; }
  .mascot:active svg { transform: scale(.94); }
  .bubble { pointer-events: auto; max-width: min(86%, 440px); padding: 7px 10px; font-size: 12.5px; line-height: 1.35; font-weight: 500; background: color-mix(in srgb, var(--surface) 93%, transparent); box-shadow: inset 0 0 0 1px var(--line-hi); clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px); transition: opacity .35s; }
  .bubble:empty, .bubble.gone { opacity: 0; pointer-events: none; }
  body.darkai .bubble { box-shadow: inset 0 0 0 1px var(--coral); }
  body.lightai .bubble { box-shadow: inset 0 0 0 1px var(--teal); }
  .bot .e-closed, .bot .e-wow, .bot .m-o, .bot .m-flat, .bot .brows, .bot .halo { display: none; }
  .bot.mood-wow .e-open, .bot.mood-wow .m-smile, .bot.mood-sleep .e-open, .bot.mood-sleep .m-smile { display: none; }
  .bot.mood-wow .e-wow, .bot.mood-wow .m-o, .bot.mood-sleep .e-closed, .bot.mood-sleep .m-flat { display: inline; }
  .bot.evil .brows, .bot.kind .halo { display: inline; }
  .bot.evil { --eye: #FF4F7B; }
  .bot .e-open ellipse { transform-box: fill-box; transform-origin: center; transition: transform .07s; }
  .bot.blink .e-open ellipse { transform: scaleY(.12); }
  .bot.mood-wow { animation: hop .45s ease-out; }
  @keyframes hop { 30% { transform: translateY(-6px); } }
  .bot .cos { display: none; }
  .bot[data-cos="fes"] .c-fes, .bot[data-cos="sapka"] .c-sapka, .bot[data-cos="tac"] .c-tac, .bot[data-cos="kep"] .c-kep,
  .bot[data-cos="gozluk"] .c-gozluk, .bot[data-cos="kulak"] .c-kulak, .bot[data-cos="papyon"] .c-papyon,
  .bot[data-cos="cay"] .c-cay, .bot[data-cos="onluk"] .c-onluk, .bot[data-cos="stetoskop"] .c-stetoskop { display: inline; }

  .brainbar { display: grid; grid-template-columns: 1.15fr 1fr 1fr 1.1fr; gap: 6px; }
  .bb { min-height: 50px; padding: 4px 6px; display: grid; gap: 2px; justify-items: center; align-content: center; background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .bb .b1 { font: 700 11.5px/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  :root[lang="ar"] .bb .b1, :root[lang="ar"] .buy .b1 { text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  .bb .b2 { font-size: 12.5px; font-weight: 600; }
  .bb.main:not(:disabled) { background: var(--sun); color: var(--on); box-shadow: 0 0 16px color-mix(in srgb, var(--sun) 35%, transparent); }
  .bb.mrg:not(:disabled) { box-shadow: inset 0 0 0 1px var(--grape); color: var(--grape); }
  .bb.lnk:not(:disabled) { box-shadow: inset 0 0 0 1px var(--sky); color: var(--sky); }
  .bb.turbo:not(:disabled) { background: var(--coral); color: var(--on); }
  .bb.turbo.live { background: var(--surface-2); color: var(--coral); box-shadow: inset 0 0 0 1px var(--coral); }
  .bb[aria-pressed="true"] { background: var(--fg) !important; color: var(--bg) !important; }
  .bb:disabled { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

  /* ===== Sekmeler ===== */
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--bg2); padding: 0 0 env(safe-area-inset-bottom, 0px); margin: 0 -10px; border-top: 1px solid var(--line); }
  .tab { position: relative; appearance: none; border: 0; background: none; padding: 7px 0 6px; min-height: 54px; display: grid; justify-items: center; align-content: center; gap: 3px; cursor: pointer; color: var(--muted); font: 600 10.5px/1.1 var(--body); -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-width: 0; }
  .tab span:not(.badge) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-selected="true"] { color: var(--teal); }
  .tab[aria-selected="true"]::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 2px; background: var(--teal); box-shadow: 0 0 10px var(--glow); }
  .tab.locked { opacity: .45; }
  .badge { position: absolute; top: 4px; inset-inline-end: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; background: var(--sun); color: var(--on); font: 700 10.5px/17px var(--mono); text-align: center; }
  .badge:empty { display: none; }

  /* ===== Paneller ===== */
  .panel, .stack { display: grid; gap: 10px; align-content: start; }
  .sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .sechead h2 { margin: 0; font: 700 14px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  :root[lang="ar"] .sechead h2 { text-transform: none; letter-spacing: 0; font-size: 15px; }
  .sechead span { font: 500 11.5px/1.3 var(--mono); color: var(--muted); }
  p.note, .note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .seg { display: flex; align-items: center; gap: 4px; }
  .seg .lbl { margin-inline-end: auto; }
  .seg button { min-height: 34px; padding: 4px 12px; border: 0; background: var(--surface-2); color: var(--muted); font: 600 12.5px/1 var(--mono); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--teal); color: var(--on); }
  .msub button { flex: 1; font-family: var(--display); text-transform: uppercase; font-size: 11.5px; letter-spacing: .04em; }
  :root[lang="ar"] .msub button { text-transform: none; font-family: var(--body); font-size: 13px; }

  .list { display: grid; }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .row.up { grid-template-columns: minmax(0, 1fr) auto; padding-inline-start: 4px; }
  .ico { position: relative; width: 44px; height: 44px; display: grid; place-items: center; color: var(--c, var(--teal)); box-shadow: inset 0 0 0 1px currentColor; background: color-mix(in srgb, var(--c, var(--teal)) 10%, transparent); }
  .ico svg { width: 22px; height: 22px; }
  .ico .cnt { position: absolute; inset-inline-end: -6px; bottom: -6px; min-width: 22px; height: 18px; padding: 0 4px; background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-hi); font: 600 11px/18px var(--mono); text-align: center; }
  .info { min-width: 0; display: grid; gap: 1px; }
  .name { font: 700 14px/1.2 var(--display); }
  .desc { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
  .meta { font: 500 11.5px/1.3 var(--mono); color: var(--teal); }
  .mile { font-size: 11.5px; color: var(--muted); }
  .row.locked { opacity: .55; }
  .row.locked .ico { color: var(--muted); }
  .buy { min-width: 86px; min-height: 48px; padding: 4px 10px; display: grid; gap: 1px; justify-items: center; align-content: center; background: var(--sun); color: var(--on); }
  .buy .b1 { font: 700 11px/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
  .buy .b2 { font: 600 13.5px/1.1 var(--mono); }
  .buy:disabled { background: var(--surface-2); color: var(--muted); }
  .empty { margin: 0; padding: 14px 4px; color: var(--muted); }

  .task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .task .t1 { font: 600 13.5px/1.3 var(--body); }
  .task .t2 { font-size: 12px; color: var(--muted); }
  .task .t2.alt { color: var(--fg); opacity: .8; }
  .task .track { height: 4px; grid-column: 1 / -1; }
  .task.done { opacity: .55; }
  .tacts { display: grid; gap: 6px; justify-items: end; }

  function frame(now) {

  }
  function render(now) {
    if (!B.stat || !B.w) return false;
    const g = ctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.drawImage(B.stat, 0, 0);
    g.setTransform(B.dpr, 0, 0, B.dpr, 0, 0);
    g.lineCap = 'round';
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i], tt = (now - p.t0) / p.ms;
      if (tt < 0) continue;
      if (tt >= 1) { flashes.set(p.to, now); pulses.splice(i, 1); continue; }
      const x = p.ax + (p.bx - p.ax) * tt, y = p.ay + (p.by - p.ay) * tt;
      g.lineWidth = 2.5; g.strokeStyle = col[p.col];
      g.beginPath(); g.moveTo(p.ax, p.ay); g.lineTo(x, y); g.stroke();
      g.beginPath(); g.arc(x, y, 3.5, 0, 6.2832); g.fillStyle = col.fg; g.fill();
    }
    flashes.forEach((t0, slot) => {
      const tt = Math.max(0, now - t0) / 300, n = neuronAt(slot), p = B.slots[slot];
      if (tt >= 1 || !n || !p) { flashes.delete(slot); return; }
      const e = 1 - tt;
      drawNeuron(g, p.x, p.y, n.l, 1 + 0.25 * e);
      g.globalAlpha = e * 0.8;
      g.beginPath(); g.arc(p.x, p.y, nRad(n.l) * (1.2 + tt * 1.2), 0, 6.2832); g.lineWidth = 2; g.strokeStyle = col.teal; g.stroke();
      g.globalAlpha = 1;
    });
    if (mg) { mgStep(now); if (mg) drawMg(g, now); }
    viruses.forEach(v => {
      const wob = eco() ? 0 : Math.sin(now / 90) * 2;
      const r = 13 + wob, left = Math.max(0, 1 - (Date.now() - v.born) / v.life);
      g.beginPath();
      for (let k = 0; k < 16; k++) { const a = k / 16 * 6.2832 + now / 700, rr = k % 2 ? r : r + 6; g.lineTo(v.x + Math.cos(a) * rr, v.y + Math.sin(a) * rr); }
      g.closePath(); g.fillStyle = col.virus; g.fill(); g.lineWidth = 1.5; g.strokeStyle = col.fg; g.stroke();
      g.fillStyle = col.bg; g.beginPath(); g.arc(v.x - 4, v.y - 2, 2.6, 0, 6.2832); g.arc(v.x + 4, v.y - 2, 2.6, 0, 6.2832); g.fill();
      g.beginPath(); g.arc(v.x, v.y, r + 11, -1.5708, -1.5708 + left * 6.2832); g.lineWidth = 2; g.strokeStyle = col.virus; g.stroke();
    });
    if (edit.mode) [edit.a, edit.b].forEach((s, k) => {
      const n = s != null ? neuronAt(s) : null, p = n && B.slots[s];

      g.beginPath(); g.arc(p.x, p.y, nRad(n.l) + 7, 0, 6.2832); g.stroke(); g.setLineDash([]);
    });
    if (drag && drag.active) {
      const a = B.slots[drag.from.s];
      g.setLineDash([6, 6]); g.lineWidth = 2; g.strokeStyle = col.fg;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(drag.x, drag.y); g.stroke(); g.setLineDash([]);
      const tg = hitNeuron(drag.x, drag.y);
      if (tg && tg !== drag.from) {
        const p = B.slots[tg.s], same = tg.l === drag.from.l;
        g.beginPath(); g.arc(p.x, p.y, nRad(tg.l) + 7, 0, 6.2832); g.lineWidth = 2.5; g.strokeStyle = same ? col.sun : col.grape; g.stroke();
        label(g, same ? t('brain.mergeTo', { n: tg.l + 1 }) : synLabel(drag.from, tg), p.x, p.y - nRad(tg.l) - 16);
      }
      drawNeuron(g, drag.x, drag.y, drag.from.l, 0.8);
    }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i], tt = Math.max(0, now - p.t0) / (p.big ? 1000 : 750);
      if (tt >= 1) { pops.splice(i, 1); continue; }
      const y = p.y - (p.big ? 56 : 42) * tt;
      g.font = '700 ' + (p.big ? 20 : 15) + 'px ' + col.font;
      g.globalAlpha = tt < 0.7 ? 1 : (1 - tt) / 0.3;
      g.lineWidth = 4; g.strokeStyle = col.bg; g.strokeText(p.text, p.x, y);
      g.fillStyle = p.big ? col.sun : col.teal; g.fillText(p.text, p.x, y);
      g.globalAlpha = 1;
    }
    return !!mg || pulses.length > 0 || flashes.size > 0 || pops.length > 0 || (viruses.length > 0 && !eco()) || !!(drag && drag.active);
  }
  function label(g, text, x, y) {
    g.font = '600 12px ' + col.body;
    const w = g.measureText(text).width + 14;
    x = Math.max(w / 2 + 4, Math.min(B.w - w / 2 - 4, x));
    y = Math.max(14, y);
    g.fillStyle = col.surface; g.strokeStyle = col.teal; g.lineWidth = 1;
    g.beginPath(); g.rect(x - w / 2, y - 11, w, 22); g.fill(); g.stroke();
    g.fillStyle = col.fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, x, y + 1);
  }
  const synKey = (a, b) => a < b ? [a, b] : [b, a];
  const synIndex = (a, b) => { const k = synKey(a, b); return state.syn.findIndex(p => p[0] === k[0] && p[1] === k[1]); };
  function synLabel(a, b) { return synIndex(a.s, b.s) >= 0 ? t('brain.synDel') : state.syn.length < synCap() ? t('brain.synAdd') : t('brain.synNone'); }
  function hitNeuron(x, y) {
    let best = null, bd = 1e9;
    state.neurons.forEach(n => { const p = B.slots[n.s]; if (!p) return; const d = Math.hypot(p.x - x, p.y - y); if (d < nRad(n.l) + 12 && d < bd) { bd = d; best = n; } });
    return best;
  }

  /* ---------- Dokunma, kombo, Aha! ---------- */
  const brainBtn = $('brainBtn'), brainWrap = $('brainWrap');
  let combo = 0, lastTapAt = 0;
  const comboX = () => 1 + (comboCap() - 1) * Math.min(1, combo / BAL.comboSteps);
  function collect(x, y, slot, auto) {
    const now = performance.now();
    if (!auto) {
      touchAct();
      combo = Math.min(BAL.comboSteps, combo + 1);
      lastTapAt = now;
      if (combo >= BAL.comboSteps && !state.comboTopRun) { state.comboTopRun = 1; state.comboTop = 1; }
    }
    const crit = Math.random() < critChance();
    let v = tapValue() * (auto ? 1 : comboX()), hallu = false;
    if (crit) v *= critMult();
    if (!auto && state.halluLeft > 0) {
      const HR = [0.1, 0.3, 1, 2, 5, 15];
      v *= HR[Math.floor(Math.random() * HR.length)];
      hallu = true;
      if (--state.halluLeft === 0) setTimeout(() => say(t('hallu.end'), 'happy'), 400);
    }
    if (!auto) evAdd('tap', 1);
    addData(v);
    state.clicks++;
    progress('tap', 1);
    if (crit) { state.crits++; progress('aha', 1); evAdd('aha', 1); }
    if (x == null) {
      const n = pick(state.neurons);
      slot = n.s; x = B.slots[n.s] ? B.slots[n.s].x : B.w / 2; y = B.slots[n.s] ? B.slots[n.s].y : B.h / 2;
    } else if (slot == null) {
      let bd = 1e9;
      state.neurons.forEach(n => { const p = B.slots[n.s]; if (!p) return; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; slot = n.s; } });
    }
    if (!auto || Math.random() < 0.34) fire(slot, crit ? 'coral' : auto ? 'grape' : 'teal');
    if (!auto && pops.length < 12) pops.push({ x: Math.max(34, Math.min(B.w - 34, x)), y: y - 8, text: (crit ? t('pop.aha') + ' +' : hallu ? '?! +' : '+') + fmt(v), t0: now, big: crit || hallu });
    wake();
    if (!auto) {
      if (crit) {
        Snd.crit(); buzz([12, 30, 25]);
        if (!eco() && !reduceMotion) { brainWrap.classList.remove('shake'); void brainWrap.offsetWidth; brainWrap.classList.add('shake'); }
        if (!state.seen.aha) { state.seen.aha = 1; say(t('tip.aha', { n: critMult() }), 'wow', 2000); }
      } else { Snd.tap(Math.min(1, combo / BAL.comboSteps)); buzz(8); }
      updateCombo();

  }
  function updateCombo() {
    const el = $('combo');

  function localPt(e) { const rc = canvas.getBoundingClientRect(); return { x: e.clientX - rc.left, y: e.clientY - rc.top }; }
  brainBtn.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    Snd.init();
    const pt = localPt(e);
    if (mg) { mgHit(pt.x, pt.y); wake(); return; }
    const vi = viruses.findIndex(v => Math.hypot(v.x - pt.x, v.y - pt.y) < 30);
    if (vi >= 0) { killVirus(vi); return; }
    const n = hitNeuron(pt.x, pt.y);
    if (edit.mode) editTap(n);
    else collect(pt.x, pt.y, n ? n.s : null, false);
    if (n && !drag) {
      drag = { id: e.pointerId, from: n, sx: pt.x, sy: pt.y, x: pt.x, y: pt.y, active: false };

  });
  brainBtn.addEventListener('pointermove', e => {

  });
  function endDrag(e, cancel) {

  /* ---------- Nöronlar: üret, birleştir, sinaps ---------- */
  function freeSlot() {
    const n = unlockedSlots();
    for (let s = 0; s < n; s++) if (!neuronAt(s)) return s;
    return -1;
  }
  $('nBuy').addEventListener('click', () => {
    Snd.init();
    const c = neuronCost(), s = freeSlot();
    if (s < 0) { Snd.nope(); say(t('n.full'), 'wow', 2000); return; }
    if (state.data < c) { Snd.nope(); return; }
    state.data -= c;
    state.nBought++;
    state.neurons.push({ s: s, l: 1 });
    Snd.buy(); buzz(10);
    rebuild();
    fire(s, 'teal');
    if (!state.seen.n2) { state.seen.n2 = 1; say(t('tip.n2'), 'wow', 3200); }
    updateAll();
  });
  function mergeInto(src, dst, quiet) {
    if (src.l !== dst.l || src === dst) return;
    state.neurons.splice(state.neurons.indexOf(src), 1);
    state.syn = state.syn.filter(p => p[0] !== src.s && p[1] !== src.s);
    dst.l++;
    state.merges++;
    state.maxLvEver = Math.max(state.maxLvEver, dst.l);
    progress('merge', 1);
    evAdd('merge', 1);
    rebuild();
    if (quiet) { fire(dst.s, 'grape'); return; }
    Snd.merge(dst.l); buzz([10, 30, 10]);
    const p = B.slots[dst.s];
    pops.push({ x: p.x, y: p.y - 14, text: t('pop.level', { n: dst.l }), t0: performance.now(), big: true });
    fire(dst.s, 'grape');
    if (!state.seen.merge) { state.seen.merge = 1; say(t('tip.merge'), 'wow', 2600); }
    else if (dst.l >= 5 && !state.seen['lv' + dst.l]) { state.seen['lv' + dst.l] = 1; say(t('tip.bigLevel', { n: dst.l }), 'wow', 2000); }
    updateAll();
  }
  // protect: sinapsı olan nöron asla "giden" taraf olmaz (kurduğun ağ bozulmaz)
  function mergeLowest(quiet, protect) {
    const by = {};
    state.neurons.forEach(n => { (by[n.l] = by[n.l] || []).push(n); });
    const ok = l => by[l].length >= 2 && (!protect || by[l].some(n => !synDeg(n.s)));
    const lv = Object.keys(by).map(Number).sort((a, b) => a - b).find(ok);
    if (lv == null) return false;
    const pair = by[lv].sort((a, b) => synDeg(b.s) - synDeg(a.s) || a.s - b.s);
    mergeInto(pair[pair.length - 1], pair[0], quiet);
    if (quiet) updateAll();
    return true;
  }
  const synDeg = s => state.syn.filter(p => p[0] === s || p[1] === s).length;
  function toggleSyn(a, b) {
    const i = synIndex(a.s, b.s);
    if (i >= 0) { state.syn.splice(i, 1); toast(t('syn.removed')); rebuild(); updateAll(); return; }
    if (state.syn.length >= synCap()) {
      Snd.nope();
      toast(synCap() ? t('syn.noSlot') : t('syn.locked'));
      return;
    }
    state.syn.push(synKey(a.s, b.s));
    state.synMade++;
    Snd.syn(); buzz(12);
    rebuild();
    fire(a.s, a.l === b.l ? 'sun' : 'grape');
    if (!state.seen.syn) { state.seen.syn = 1; say(t('tip.syn'), 'wow', 2600); }
    updateAll();
  }

  /* ---------- Düzenleme modları: iki nörona dokun, sonucu gör, onayla ---------- */
  const edit = { mode: null, a: null, b: null };
  function setEditMode(m) {

  function editTap(n) {

    else if (n.s === edit.a) { edit.a = null; }

  }
  const pctTxt = (a, b) => (b >= a ? '+' : '') + dec(((b / a - 1) * 100).toFixed(Math.abs(b / a - 1) < 0.1 ? 1 : 0)) + '%';
  function previewTxt(ns, sy) {
    const p0 = brainPower(), p1 = powerOf(ns, sy);
    const i0 = 1 + BAL.idleK * Math.sqrt(p0), i1 = 1 + BAL.idleK * Math.sqrt(p1);
    return t('edit.preview', { a: fmt(p0), b: fmt(p1), p: pctTxt(p0, p1), i: pctTxt(i0, i1), d: pctTxt(Math.pow(p0, BAL.tapPow), Math.pow(p1, BAL.tapPow)) });
  }
  function editBtn(txt, fn, go) {

  function updateEdit() {

  /* ---------- Veri paketi ve sürprizler ---------- */
  function spawnPacket() {

  /* ---------- Günlük görevler (esnek: her satırda "X veya Y") ----------
     Her satırda bir aktif (dokunma, Aha, paket, birleştirme) ve bir rahat seçenek (veri, alışveriş, gezi, proje) var;
     hangisi önce biterse satır tamamlanır. Günde bir ücretsiz "Değiştir", imkânsız hale gelen satır her zaman ücretsiz değişir. */
  const TASKS = {
    tap: { k: 'a', goal: () => pick([150, 300, 500]), ok: () => !chIs('pasif') },
    aha: { k: 'a', goal: () => 5, ok: () => !chIs('pasif') },
    packet: { k: 'a', goal: () => 2, ok: () => !chIs('pasif') },
    merge: { k: 'a', goal: () => state.merges < 10 ? 3 : 6, ok: () => true },
    earn: { k: 'i', goal: () => niceNum(Math.max(500, dps(true) * 1800 + tapValue(true) * 100)), ok: () => true },
    buy: { k: 'i', goal: () => totalGen() < 30 ? 10 : 25, ok: () => true },
    upg: { k: 'i', goal: () => 2, ok: () => UP.filter(u => !state.upg[u.id]).length >= 4 },
    trip: { k: 'i', goal: () => 1, ok: () => true },
    proj: { k: 'i', goal: () => 1, ok: () => projOpen() },
    turbo: { k: 'i', goal: () => 1, ok: () => true }
  };
  const taskTxt = q => t('task.' + q.t, { g: q.t === 'earn' ? fmt(q.goal) : q.goal });
  const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  let taskKey = '';
  const mkTask = k => ({ t: k, goal: TASKS[k].goal(), prog: 0 });
  function pickPair(used) {
    const pool = k => Object.keys(TASKS).filter(x => TASKS[x].k === k && TASKS[x].ok() && used.indexOf(x) < 0);
    const A = pool('a'), I = pool('i');
    const a = A[Math.floor(Math.random() * A.length)] || 'merge', i = I[Math.floor(Math.random() * I.length)] || 'earn';
    used.push(a, i);
    return { a: mkTask(a), b: mkTask(i), claimed: false };
  }
  const slotDone = x => x.a.prog >= x.a.goal || x.b.prog >= x.b.goal;
  const slotValid = x => TASKS[x.a.t].ok() || TASKS[x.b.t].ok();
  function ensureDaily() {
    const k = dayKey();
    if (state.daily && state.daily.v === 2 && state.daily.day === k && state.daily.tasks.every(x => x.a && x.b && TASKS[x.a.t] && TASKS[x.b.t])) return;
    const used = [];
    state.daily = { v: 2, day: k, perfect: false, rerolls: 1, tasks: [pickPair(used), pickPair(used), pickPair(used)] };
    taskKey = '';
  }
  function progress(type, n) {
    if (!state.daily) return;
    state.daily.tasks.forEach(x => {
      if (x.claimed || slotDone(x)) return;
      [x.a, x.b].forEach(q => { if (q.t === type) q.prog = Math.min(q.goal, q.prog + n); });
      if (slotDone(x)) {
        const q = x.a.prog >= x.a.goal ? x.a : x.b;
        say(t('task.done', { t: taskTxt(q) }), 'wow', 2400);
        Snd.ach(); buzz([15, 50, 15]);
        taskKey = '';
      }
    });
  }
  // Ödüller geçici güçlendirmeler (turbo, İlham, beğeni) hariç taban üretime göre hesaplanır.
  const taskReward = () => Math.max(250, dps(true) * 300 + tapValue(true) * 100) * (perk('tutor') ? 3 : 1);
  const taskList = $('taskList');
  const qTxt = q => taskTxt(q) + ' · ' + (q.t === 'earn' ? fmt(q.prog) + '/' + fmt(q.goal) : Math.floor(q.prog) + '/' + q.goal);
  function updateTasks() {
    const d = state.daily;
    const key = d.day + d.rerolls + LANG.meta.id + d.tasks.map(x => x.a.t + x.b.t + (slotDone(x) ? (x.claimed ? 'c' : 'r') : 'o') + slotValid(x)).join('');
    if (key !== taskKey) {
      taskKey = key;
      taskList.innerHTML = '';
      d.tasks.forEach((x, i) => {
        const el = document.createElement('div');
        el.className = 'task' + (x.claimed ? ' done' : '');
        el.innerHTML = '<div><div class="t1"></div><div class="t2 alt"></div><div class="t2"></div></div>' +
          '<div class="tacts"><button type="button" class="claim btn" data-claim="' + i + '"></button>' +
          (!x.claimed && !slotDone(x) && (d.rerolls > 0 || !slotValid(x)) ? '<button type="button" class="pill-btn" data-reroll="' + i + '">' + t('task.reroll') + '</button>' : '') +
          '</div><div class="track"><i></i></div>';
        taskList.appendChild(el);
      });
    }
    taskList.querySelectorAll('.task').forEach((el, i) => {
      const x = d.tasks[i], ready = slotDone(x);
      const t2 = el.querySelectorAll('.t2'), btn = el.querySelector('.claim');
      setText(el.querySelector('.t1'), qTxt(x.a));
      setText(t2[0], t('task.or') + ' ' + qTxt(x.b));
      setText(t2[1], x.claimed ? t('task.claimed') : t('task.reward', { n: fmt(taskReward()) }));
      setText(btn, x.claimed ? t('task.took') : ready ? t('btn.claim') : t('task.cont'));
      btn.disabled = !ready || x.claimed;
      const pr = Math.max(x.a.prog / x.a.goal, x.b.prog / x.b.goal);
      el.querySelector('.track i').style.width = (Math.min(1, pr) * 100).toFixed(1) + '%';
    });
    const now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const left = Math.max(0, Math.floor((mid - now) / 60000));
    setText($('dayLeft'), (d.rerolls ? t('task.free') + ' · ' : '') + t('task.renew', { t: t('u.hm', { h: Math.floor(left / 60), m: left % 60 }) }));
  }
  taskList.addEventListener('click', e => {

  /* ---------- Model eğitimi ve sıfırlama ---------- */
  function twoStep(btn, armKey, restore, fn) {
    btn.addEventListener('click', () => {
      if (btn._armed) {
        clearTimeout(btn._timer);
        btn._armed = false; btn._t = undefined;
        restore(); fn();
      } else {
        btn._armed = true;
        btn.textContent = t(armKey); btn._t = undefined;
        btn._timer = setTimeout(() => { btn._armed = false; btn._t = undefined; restore(); }, 4000);
      }
    });
  }
  function resetRun() {
    state.data = kv('burs') ? 100 * Math.pow(10, kv('burs')) : 0; state.run = 0; state.gen = G.map(() => 0); state.upg = {};
    state.neurons = [{ s: 0, l: 1 }]; state.syn = []; state.nBought = 0; state.choices = {}; state.karma = 0;

  const QMAX = 21, LAX = 4.5;
  function drawChart() {
    const c = $('chart'), w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }
    const g = c.getContext('2d'), k = col;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const L = 30, R = 14, T = 16, Bt = 24;
    const X = q => L + q / QMAX * (w - L - R);
    const Y = l => T + (1 - l / LAX) * (h - T - Bt);
    g.font = '500 11px ' + k.body;
    g.lineWidth = 1;
    [0, 1, 2, 3, 4].forEach(v => {
      g.strokeStyle = k.edge; g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(w - R, Y(v)); g.stroke();

    });

    const q = qNow();
    g.beginPath();
    for (let s = 0; s <= q + 1e-4; s += 0.1) { const x = X(s), y = Y(lossAt(s)); if (s === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    g.lineTo(X(q), Y(lossAt(q))); g.lineTo(X(q), Y(0)); g.lineTo(X(0), Y(0)); g.closePath();
    g.globalAlpha = 0.16; g.fillStyle = k.teal; g.fill(); g.globalAlpha = 1;
    g.strokeStyle = k.muted; g.setLineDash([4, 5]);
    g.beginPath();
    for (let s = 0; s <= QMAX + 1e-3; s += 0.25) { const x = X(s), y = Y(lossAt(s)); if (s === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    g.stroke(); g.setLineDash([]);
    g.strokeStyle = k.teal; g.lineWidth = 2.5; g.lineJoin = 'round';
    g.beginPath();
    for (let s = 0; s <= q + 1e-4; s += 0.1) { const x = X(s), y = Y(lossAt(s)); if (s === 0) g.moveTo(x, y); else g.lineTo(x, y); }
    g.lineTo(X(q), Y(lossAt(q))); g.stroke();
    const mx = X(q), my = Y(lossAt(q));
    g.fillStyle = k.sun; g.strokeStyle = k.bg; g.lineWidth = 2;
    g.beginPath(); g.arc(mx, my, 6, 0, 6.2832); g.fill(); g.stroke();
    g.fillStyle = k.fg; g.font = '700 13px ' + k.font; g.textBaseline = 'bottom';
    const right = mx > w * 0.6;
    g.textAlign = right ? 'right' : 'left';
    g.fillText(t('chart.loss', { n: dec(lossAt(q).toFixed(2)) }), mx + (right ? -10 : 10), my - 8);
  }

  /* ---------- Lo-fi müzik (kodla üretilir, dosya yok) ---------- */
  const Music = {
    timer: 0, step: 0, nextT: 0, bus: null, noise: null,
    start() {
      const c = Snd.ctx;
      if (!c || this.timer || !state.opt.music || document.hidden) return;
      if (c.state === 'suspended') c.resume();
      if (!this.bus) {
        this.bus = c.createGain(); this.bus.gain.value = 0.55;
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
        this.bus.connect(lp); lp.connect(c.destination);
        const buf = c.createBuffer(1, c.sampleRate * 0.05, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        this.noise = buf;
      }
      this.nextT = c.currentTime + 0.15;
      this.timer = setInterval(() => this.sched(), 300);
    },
    stop() { clearInterval(this.timer); this.timer = 0; },
    note(m, t0, dur, type, vol, att) {
      const c = Snd.ctx, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + att);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.bus); o.start(t0); o.stop(t0 + dur + 0.05);
    },
    sched() {
      const c = Snd.ctx;
      if (!c) return;
      const stepDur = 60 / 72 / 2;
      while (this.nextT < c.currentTime + 0.7) { this.play(this.step, this.nextT, stepDur); this.nextT += stepDur; this.step++; }
    },
    play(i, t0, sd) {
      const dark = alignment() === 'h';
      const CH = dark ? [[45, 48, 52, 55], [41, 45, 48, 52], [43, 46, 50, 53], [40, 43, 47, 50]]
        : [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];
      const bar = Math.floor(i / 8) % 4, s = i % 8, ch = CH[bar];
      if (s === 0) ch.forEach((m, k) => this.note(m + 12, t0 + k * 0.03, sd * 8.5, 'triangle', 0.016, 0.35));
      if (s === 0 || s === 5) this.note(ch[0] - 12, t0, sd * 2, 'sine', 0.06, 0.02);
      if (s % 2 === 1 && !eco()) {
        const n = Snd.ctx.createBufferSource(), g = Snd.ctx.createGain();
        n.buffer = this.noise; g.gain.value = s === 3 || s === 7 ? 0.018 : 0.009;
        n.connect(g); g.connect(this.bus); n.start(t0);
      }
      if ((s === 2 || s === 4 || s === 7) && Math.random() < 0.45) {
        const scale = dark ? [69, 72, 74, 76, 79] : [72, 74, 76, 79, 81];
        this.note(pick(scale), t0, sd * 1.6, 'sine', 0.022, 0.01);
      }
    }
  };

  /* ---------- Müşteri projeleri ----------
     Her teklifte iki yol: Hızlı (3 dk, bu tura veri) ya da Özenli (30 dk, çip + kalıcı referans).
     Kalite yıldızı kurduğun yapıya bağlı: Hızlı yol kaynak çeşitliliğini, Özenli yol nöron ağını ödüllendirir.
     Kısa oturumda ya da eşiğe yakınken Hızlı, uzun ayrılıkta ya da uzun vadede Özenli mantıklıdır. */
  const PMODE = [{ ms: 180000, cost: 60 }, { ms: 1800000, cost: 300 }];
  function projOpen() { return state.bestTier >= 2 || state.projDone > 0; }
  function projQuality(a) {
    if (a === 0) {
      const kinds = state.gen.filter(n => n > 0).length;
      return 1 + (kinds >= 4 ? 1 : 0) + (state.gen.some(n => n >= 100) ? 1 : 0);
    }
    return 1 + (maxLevel() >= tierIdx() + 3 ? 1 : 0) + (synCap() > 0 && state.syn.length >= synCap() ? 1 : 0);
  }
  const qHint = a => a === 0 ? t('pr.hintA') : t('pr.hintB', { n: tierIdx() + 3 });
  const stars = n => '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n);
  const projCost = a => Math.max(50, dps(true) * PMODE[a].cost);
  const projData = q => Math.max(500, dps(true) * 720 * [1, 1.5, 2][q - 1]);
  const firstStory = x => x.story && state.projStory[x.id] !== 1;
  function nextOffer() {
    const st = PROJ.filter(p => p.story && !state.projStory[p.id] && state.projDone >= p.at);
    if (st.length) return st[0].id;
    // Hızlı yolla geçilen hikâye projeleri havuza döner: hediyeyi kaçıran oyuncu sonra Özenli yolla alabilir.
    const last = state.projOffer ? state.projOffer.id : '';
    const pool = PROJ.filter(p => (!p.story || state.projStory[p.id] === 'f') && p.id !== last);
    return pick(pool).id;
  }
  function ensureOffer() { if (projOpen() && !state.proj && !state.projOffer) state.projOffer = { id: nextOffer() }; }
  const projBox = $('projBox');
  let projKey = '';
  function projCard(html) { const d = document.createElement('div'); d.className = 'pcard'; d.innerHTML = html; return d; }
  const rewardB = (q, x) => t('pr.rwB', { c: q + (firstStory(x) ? 2 : 0) }) + (firstStory(x) ? ' + ' + t('pr.gift') : '');
  function updateProj() {
    ensureOffer();
    const now = Date.now(), P = state.proj, O = state.projOffer;
    setText($('projSum'), t('pr.sum', { d: state.projDone, r: state.refs, p: Math.round(state.refs * BAL.refBonus * 100) }));
    setText($('projNote'), t(projOpen() ? 'pr.note' : 'pr.locked'));
    const key = (!projOpen() ? 'lock' : P ? 'run' + P.id + P.a + (now >= P.until) : 'off' + (O && O.id)) + LANG.meta.id;
    if (key !== projKey) {
      projKey = key;
      projBox.innerHTML = '';
      if (!projOpen()) return;
      if (P) {
        const x = PROJ_BY[P.id], X = projText(P.id), ap = P.a ? X.B : X.A;
        const c = projCard('<div class="pc-h"><span class="ava"></span><div><b class="pc-c"></b><small class="pc-t"></small></div></div><p class="pc-d"></p><div class="track"><i></i></div><div class="acts"><button type="button" class="claim btn" data-pdo="deliver"></button><button type="button" class="pill-btn" data-pdo="cancel"></button></div>');
        c.querySelector('.pc-c').textContent = X.c; c.querySelector('.pc-t').textContent = X.t + ' · ' + t(P.a ? 'pr.slow' : 'pr.fast');
        c.querySelector('.pc-d').textContent = ap.n + '. ' + t('pr.q', { s: stars(P.q) }) + ' ' + (P.a ? t('pr.rw', { r: rewardB(P.q, x) }) : t('pr.rwA', { n: fmt(projData(P.q)) }));
        c.querySelector('.ava').textContent = X.c.charAt(0);
        c.querySelector('[data-pdo="cancel"]').textContent = t('pr.cancel');
        projBox.appendChild(c);
      } else if (O) {
        const x = PROJ_BY[O.id], X = projText(O.id);
        const c = projCard('<div class="pc-h"><span class="ava"></span><div><b class="pc-c"></b><small class="pc-t"></small></div></div><p class="pc-d"></p><div class="cards pc-opts"></div><div class="acts"><button type="button" class="pill-btn" data-pdo="skip"></button></div>');
        c.querySelector('.pc-c').textContent = X.c + (x.story ? ' · ' + t('pr.story') : '');
        c.querySelector('.pc-t').textContent = X.t;
        c.querySelector('.pc-d').textContent = X.d;
        c.querySelector('.ava').textContent = X.c.charAt(0);
        [X.A, X.B].forEach((ap, a) => {
          const st = a ? x.B : x.A;
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'choice btn popt ' + (a ? 'slow' : 'fast'); b.dataset.pgo = a;
          b.innerHTML = '<span class="tag"></span><b></b><span class="d"></span><span class="st"></span><span class="rw"></span><span class="go"></span>';
          b.querySelector('.tag').textContent = t(a ? 'pr.slowTag' : 'pr.fastTag');
          b.querySelector('b').textContent = ap.n;
          b.querySelector('.d').textContent = ap.d;
          b.querySelector('.st').textContent = t('pr.stars', { a: stars(st[0]), b: stars(st[1]), c: stars(st[2]) });
          c.querySelector('.pc-opts').appendChild(b);
        });
        projBox.appendChild(c);
      }
    }
    if (!projOpen()) return;
    if (P) {
      const done = now >= P.until, bar = projBox.querySelector('.track i'), b = projBox.querySelector('[data-pdo="deliver"]');
      if (bar) bar.style.width = (Math.min(1, 1 - (P.until - now) / PMODE[P.a].ms) * 100).toFixed(1) + '%';
      if (b) { setText(b, done ? t('pr.deliver') : leftText(P.until - now)); b.disabled = !done; }
      const cb = projBox.querySelector('[data-pdo="cancel"]'); if (cb) cb.hidden = done;
    } else if (O) {
      const x = PROJ_BY[O.id];
      projBox.querySelectorAll('[data-pgo]').forEach(b => {
        const a = Number(b.dataset.pgo), q = projQuality(a), cost = projCost(a);
        setText(b.querySelector('.rw'), t('pr.cost', { n: fmt(cost) }) + ' · ' + (a ? rewardB(q, x) : t('pr.rwA', { n: fmt(projData(q)) })));
        setText(b.querySelector('.go'), t('pr.est', { s: stars(q) }) + (q < 3 ? ' · ' + qHint(a) : ''));
        b.disabled = state.data < cost;
      });
      const sk = projBox.querySelector('[data-pdo="skip"]');
      if (sk) { const w = state.projSkipAt - now; setText(sk, w > 0 ? t('pr.skipWait', { t: leftText(w) }) : t('pr.skip')); sk.disabled = w > 0 || (x.story && !state.projStory[O.id]); }
    }
  }
  projBox.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    Snd.init();
    const now = Date.now();
    if (b.dataset.pgo != null && state.projOffer && !state.proj) {
      const a = Number(b.dataset.pgo), cost = projCost(a);
      if (state.data < cost) { Snd.nope(); return; }
      state.data -= cost;
      state.proj = { id: state.projOffer.id, a: a, until: now + PMODE[a].ms, q: projQuality(a) };
      state.projOffer = null;
      Snd.buy(); buzz(12);
      say(t(a ? 'pr.goSlow' : 'pr.goFast'), 'wow', 2200);
    } else if (b.dataset.pdo === 'cancel' && state.proj) {
      state.projOffer = { id: state.proj.id };
      state.proj = null;
      toast(t('pr.canceled'));
    } else if (b.dataset.pdo === 'skip' && state.projOffer && now >= state.projSkipAt) {
      state.projSkipAt = now + 600000;
      state.projOffer = { id: nextOffer() };
    } else if (b.dataset.pdo === 'deliver' && state.proj && now >= state.proj.until) {
      const P = state.proj, x = PROJ_BY[P.id], X = projText(P.id);
      let msg;
      if (P.a) {
        const first = firstStory(x), ch = P.q + (first ? 2 : 0);
        state.chips += ch; state.refs++;
        if (first) { state.projStory[x.id] = 1; if (x.cos) { state.cos = x.cos; syncSettings(); } }
        msg = t('pr.gotB', { c: ch, p: Math.round(BAL.refBonus * 100) });
        showStory(X.c, X.t, X.eB + (first && x.cos ? '\n\n' + t('pr.newCos', { n: TX().costumes[x.cos].n }) : ''));
      } else {
        const v = projData(P.q);
        addData(v);
        if (x.story && !state.projStory[x.id]) state.projStory[x.id] = 'f';
        msg = t('pr.gotA', { n: fmt(v) });
        say(X.eA, 'wow', 3200);
      }
      state.projDone++;
      state.proj = null;
      state.projOffer = { id: nextOffer() };
      progress('proj', 1);
      Snd.ach(); buzz([15, 40, 15]);
      toast(t('pr.delivered', { m: msg }));
    }
    projKey = '';
    updateAll(); save();
  });

  /* ---------- Reklam kancası (yalnızca mobil uygulama sürümü için) ----------
     Web sürümünde reklam yoktur. İleride yerel bir uygulama window.YZAds.show() sağlarsa
     yalnızca oyuncunun kendi seçtiği ödüllü reklamlar (ör. 30 dk ×2, günde en fazla 5) açılacak. */
  const Ads = window.YZAds && typeof window.YZAds.show === 'function' ? window.YZAds : null;

  /* ---------- Sekmeler ---------- */
  let curTab = 'gen';
  function selectTab(id) {
    curTab = id;
    state.opt.tab = id;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    document.querySelectorAll('.panel').forEach(p => { p.hidden = p.id !== 'panel-' + id; });
    $('panels').scrollTop = 0;
    updatePanel(true);
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { Snd.init(); selectTab(b.dataset.tab); }));
  function selectSub(id) {
    state.opt.msub = id;
    document.querySelectorAll('#msub [data-msub]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.msub === id)));
    document.querySelectorAll('#panel-model [data-sub]').forEach(d => { d.hidden = d.dataset.sub !== id; });
    updatePanel(true);
  }
  $('msub').addEventListener('click', e => { const b = e.target.closest('[data-msub]'); if (b) selectSub(b.dataset.msub); });

  /* ---------- Göstergeler ---------- */
  let lastTier = -1;
  function updateTop() {
    setText($('data'), fmt(state.data));
    setText($('dps'), t('hud.rate', { n: fmt(dps()) }));
    setText($('brainPow'), t('hud.power', { n: fmt(brainPower()) }));
    setText($('multAll'), '×' + fmt(globalMult() * srcGlobal()));
    setText($('tapNote'), '+' + fmt(tapValue()) + ' ' + t('hud.perTap'));
    const idx = tierIdx();
    setText($('tierName'), tierName(idx));
    setText($('labChip'), state.ch ? '⚑ ' + TX().chal[state.ch.id].n : labText().n + (loopN() ? ' · ' + t('lab.short', { n: loopN() + 1 }) : ''));
    if (idx < TIERS.length - 1) {
      const lo = idx === 0 ? 0 : Math.log10(TIERS[idx].at), hi = Math.log10(TIERS[idx + 1].at);
      const pct = Math.max(0, Math.min(1, (Math.log10(1 + state.run) - lo) / (hi - lo)));
      $('tierBar').style.width = (pct * 100).toFixed(1) + '%';
      setText($('tierNext'), t('hud.next', { t: tierName(idx + 1), n: fmt(TIERS[idx + 1].at) }));
    } else {
      $('tierBar').style.width = '100%';
      setText($('tierNext'), t('hud.max'));
    }
    if (lastTier >= 0 && idx > lastTier) {
      state.bestTier = Math.max(state.bestTier, idx);
      rebuild();
      for (let i = 0; i < 6; i++) setTimeout(() => { const n = pick(state.neurons); if (n) fire(n.s, 'grape'); }, i * 80);
      const rn = REG[idx] ? regName(idx) : tierName(idx);
      sayA('tier.up', { r: rn, t: tierName(idx) }, 'wow', 2600);
      postReact(alignment() === 'h' ? 'react-h' : alignment() === 'f' ? 'react-f' : 'react-n');
      setTimeout(openChoice, 700);
    }
    lastTier = idx;
  }
  function updateBadges() {
    const affordableUps = availUps().filter(u => state.data >= upCost(u)).length;
    setText($('upBadge'), affordableUps ? String(affordableUps) : '');
    const cl = claimable() + (state.mission && Date.now() >= state.mission.until ? 1 : 0);
    setText($('goalBadge'), cl ? String(cl) : '');
    setText($('modelBadge'), gain() >= 1 ? '!' : '');
    setText($('projBadge'), state.proj && Date.now() >= state.proj.until ? '!' : '');
    $('tab-proj').classList.toggle('locked', !projOpen());
  }
  function updatePanel(force) {
    if (curTab === 'gen') { updateGens(); if (force || tickN % 8 === 0) updateAutoUi(); }
    else if (curTab === 'up') updateUpgrades();
    else if (curTab === 'proj') updateProj();
    else if (curTab === 'goal') { updateEvent(); updateMissions(); updateTasks(); }
    else if (state.opt.msub === 'kasa') updateKasa();
    else if (state.opt.msub === 'stats') updateStats(force);
    else { updateModel(force); updateTek(); updateChal(); }
  }
  function updateAll() {
    updateTop();
    updateBrainBar();
    updatePanel();
    updateTurbo();
    updateBadges();
  }

  /* ---------- İpuçları ---------- */
  function tips() {
    const s = state.seen;
    if (!s.n1 && state.data >= neuronCost() && state.nBought === 0) { s.n1 = 1; say(t('tip.n1'), 'wow', 2200); return; }
    if (!s.t15 && state.data >= 15 && totalGen() === 0 && state.nBought > 0) { s.t15 = 1; say(t('tip.t15', { g: gName(0) }), 'wow', 2200); return; }
    if (!s.up && availUps().length > 0 && state.run > 40) { s.up = 1; say(t('tip.up'), 'wow', 2000); return; }
    if (!s.combo && combo >= 10) { s.combo = 1; say(t('tip.combo'), 'wow', 2000); return; }
    if (!s.turbo && state.run > 300 && turboReady()) { s.turbo = 1; say(t('tip.turbo'), 'happy'); return; }
    if (!s.goal && state.life > 800) { s.goal = 1; say(t('tip.goal'), 'happy'); return; }
    if (!s.prest && gain() >= 1) { s.prest = 1; say(t('tip.prest'), 'wow', 2200); return; }
    if (mood !== 'sleep' && Date.now() > nextQuip && Date.now() - lastSayAt > 25000 && Date.now() - lastAct < 45000) {
      const a = alignment(), Q = TX().quips, pool = a === 'n' ? Q.n : Q[a].concat(Q[a], Q.n);
      say(pick(pool), 'happy');
      nextQuip = Date.now() + 55000 + Math.random() * 35000;
      return;
    }
    if (mood !== 'sleep' && Date.now() - lastAct > 45000) {
      sayA('nero.sleep', null, 'sleep');
      clearTimeout(moodTimer);
    }
  }

  /* ---------- Döngü ---------- */
  let tickTimer = 0, tickN = 0, ambientAt = 0, botAcc = 0, autoMergeAt = 0, autoBuyAt = 0;
  // Otomatik alıcı: "Verimli" = maliyet / eklenen üretim en düşük olan (eşik ×2'si dahil);
  // "Eşiğe tamamla" = bir sonraki ×2 eşiğine en ucuz ulaşılan kaynak; "Seçili" = yalnız seçtiğin kaynak.
  function genGain(i) {
    const n = state.gen[i], m = srcMult(i), hit = BAL.miles.indexOf(n + 1) >= 0;
    return G[i].r * ((n + 1) * m * (hit ? 2 : 1) - n * m);
  }
  function autoPick() {
    const a = state.auto, open = G.map((_, i) => genBuyable(i));
    if (a.mode === 'sel') return open[a.sel] ? a.sel : -1;
    let best = -1, bv = Infinity, bestA = -1, bvA = Infinity;
    G.forEach((g, i) => {
      if (!open[i]) return;
      let v;
      if (a.mode === 'mile') { const nm = BAL.miles.find(x => x > state.gen[i]); v = nm ? costFor(i, nm - state.gen[i]) : Infinity; }
      else v = costFor(i, 1) / genGain(i);
      if (v < bv) { bv = v; best = i; }
      if (costFor(i, 1) <= state.data && v < bvA) { bvA = v; bestA = i; }
    });
    if (best < 0) return -1;
    if (costFor(best, 1) <= state.data) return best;
    const d = dps(true);
    return d > 0 && (costFor(best, 1) - state.data) / d > 30 ? bestA : -1;
  }
  function autoBuy(times) {
    let k = 0;
    for (; k < times; k++) {
      const i = autoPick();
      if (i < 0 || costFor(i, 1) > state.data) break;
      state.data -= costFor(i, 1);
      state.gen[i]++;
      progress('buy', 1);
    }
    return k;
  }
  function tick() {
    const now = Date.now();
    // Zamanlayıcı uzun süre durduysa (cihaz uykusu vb.) o boşluk çevrimdışı gibi işlenir; tek bir yol, tek sefer kazanç.
    if (now - state.last > 5000) catchUp();
    let dt = (now - state.last) / 1000;
    state.last = now;
    if (dt < 0) dt = 0;
    state.played += dt;
    const d = dps();
    if (d > 0) addData(d * dt);
    if (perk('botnet') && !chIs('pasif')) {
      botAcc += 3 * dt;
      let k = 0;
      while (botAcc >= 1 && k++ < 12) { botAcc--; collect(null, null, null, true); }
      if (botAcc > 12) botAcc = 0;
    }
    if (combo > 0 && performance.now() - lastTapAt > 900) { combo = Math.max(0, combo - BAL.comboDecay * labM('combo', 1) * dt); updateCombo(); }
    // Virüsler: yaşarken veriyi emer
    if (viruses.length) {
      state.data = Math.max(0, state.data * Math.pow(0.98, dt * viruses.length));
      viruses = viruses.filter(v => {
        if (now - v.born < v.life) return true;
        const n = pick(state.neurons);
        say(t('virus.escaped'), 'wow', 2000);
        if (n) fire(n.s, 'coral');
        return false;
      });
      render(performance.now());
    }
    if (state.karma < 0 && !choiceOpen) {
      if (!nextVirus) planVirus();
      else if (now >= nextVirus) { spawnVirus(); planVirus(); }
    }
    ensureDaily();
    ensureEvent();
    evAdd('time', dt / 60);
    if (now >= nextPostAt) { postNews(); nextPostAt = now + 45000 + Math.random() * 30000; }
    if (tickN % 20 === 0) renderFeed();
    if (autoMergeOpen() && state.auto.merge && now - autoMergeAt > (state.tree.amerge ? 2000 : 8000)) { autoMergeAt = now; mergeLowest(true, state.auto.protect); }
    if (autoBuyOpen() && state.auto.buy && now - autoBuyAt > (state.tree.abuy ? 1000 : 4000)) { autoBuyAt = now; autoBuy(state.tree.abuy ? 10 : 1); }
    updateAll();
    if (++tickN % (eco() ? 2 : 4) === 0) { checkAch(false); tips(); checkChal(); }
    if (!eco() && d > 0 && now - ambientAt > 2600 && state.neurons.length) {
      ambientAt = now;
      fire(pick(state.neurons).s, 'teal');
    }
  }
  function restartTick() {
    clearInterval(tickTimer);
    if (!document.hidden) tickTimer = setInterval(tick, eco() ? 500 : 250);
  }
  const offRate = () => perk('medical') || state.tree.dream || labM('off', 0) ? 1 : Math.min(1, BAL.offline + kv('hafiza') * 0.08);
  const offCap = () => (state.tree.dream ? 86400 : BAL.offlineCap) + (chWon('pasif') ? 43200 : 0);
  // Çevrimdışı: yalnız pasif kaynak üretimi, geçici güçlendirmeler hariç. Kısa yokluklar (≤60 sn) doğrudan eklenir,
  // uzunlar "Topla" kutusuna birikir. Eğitim/Tekillik öncesi kutu otomatik toplanır (bankOffline).
  function catchUp() {
    const now = Date.now(), el = Math.max(0, (now - state.last) / 1000), rate = dps(true);
    state.last = now;
    if (el < 1 || rate <= 0) return;
    const tt = Math.min(el, offCap()), v = rate * tt * offRate();
    state.played += tt;
    if (el <= 60) { addData(v); return; }
    state.pendingOff += v;
    showOffline(el);
  }
  function bankOffline() {
    if (state.pendingOff <= 0) return;
    const v = state.pendingOff;
    state.pendingOff = 0;
    addData(v);
    closeModal('offline');
  }
  function showOffline(el) {
    if (state.pendingOff <= 0) return;
    $('offText').textContent = t('off.text', { t: el ? fmtTime(el) : '—', n: fmt(state.pendingOff), p: Math.round(offRate() * 100), h: Math.round(offCap() / 3600) });
    $('offX2').hidden = !turboReady();
    openModal('offline');
  }
  function claimOffline(x2) {
    let v = state.pendingOff;
    if (v <= 0) { closeModal('offline'); return; }
    if (x2) { if (!turboReady()) return; v *= 2; state.turboReadyAt = Date.now() + turboCd(); state.turbos++; }
    state.pendingOff = 0;
    addData(v);
    closeModal('offline');
    Snd.init(); Snd.packet(); buzz(15);
    toast(t('off.got', { n: fmt(v) }));
    say(t('off.hi'), 'happy');
    updateAll();
  }
  $('offOk').addEventListener('click', () => claimOffline(false));
  $('offX2').addEventListener('click', () => claimOffline(true));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (mg) mgEnd(true);
      save();
      clearInterval(tickTimer);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      Music.stop();
      if (Snd.ctx && Snd.ctx.state === 'running') Snd.ctx.suspend();
    } else {
      catchUp();
      if (Snd.ctx) syncMusic();
      pulses.length = 0; pops.length = 0; flashes.clear();
      render(performance.now());
      restartTick();
      updateAll();
    }
  });
  window.addEventListener('pagehide', save);
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const check = () => {
        const low = b.level <= 0.2 && !b.charging;
        if (low !== batteryLow) {
          batteryLow = low;
          if (state.opt.eco === null) { applyEco(); syncSettings(); if (low) say(t('eco.battery'), 'wow', 2200); }
        }
      };
      check();
      b.addEventListener('levelchange', check);
      b.addEventListener('chargingchange', check);
    }).catch(() => { /* pil bilgisi yok */ });
  }

  /* ---------- Tema, dil ve boyut ---------- */
  function applyTheme() {
    const r = document.documentElement;
    if (state.opt.theme === 'auto') { if (r.dataset.theme && r._ours) { delete r.dataset.theme; } r._ours = false; }
    else { r._ours = true; r.dataset.theme = state.opt.theme; }
    onTheme();
  }
  function onTheme() { readColors(); rebuild(); if (curTab === 'model' && state.opt.msub === 'stats') drawChart(); }
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', onTheme);
  }
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.ResizeObserver) new ResizeObserver(() => layoutBrain()).observe(brainBtn);
  else window.addEventListener('resize', () => layoutBrain());

  function applyLang(id) {
    LANG = LANGS[id] || LANGS.en || LANGS.tr;
    const r = document.documentElement;
    r.lang = LANG.meta.id; r.dir = LANG.meta.dir;
    document.title = LANG.meta.title;
    state.langsSeen[LANG.meta.id] = 1;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); el._t = undefined; });
    document.querySelectorAll('[data-ta]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
    upKey = ''; taskKey = ''; misKey = ''; projKey = ''; chKey = ''; evIcoKey = ''; feedKey = '';
    $('perkList')._k = '';
    rows.forEach(rw => { rw.lang = ''; });
    achTexts();
    if (state.feedLang !== LANG.meta.id) { state.feed = []; lastNews = []; postNews(); }
    readColors();
    rebuild();
    syncAlignLook();
    syncSettings();
    if (choiceOpen) { const c = choiceOpen; choiceOpen = 0; closeModal('choice'); openChoice(c); }
    renderFeed();
    updateAll();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); rebuild(); });
  }

  /* ---------- Açılış ---------- */
  function start(data) {
    const had = (data && typeof data.s === 'string') ? loadFrom(data.s) : load();
    LANG = LANGS[state.opt.lang || detectLang()] || LANGS.en || LANGS.tr;
    ensureDaily();
    ensureEvent();
    buildSettings();
    applyTheme();
    applyLang(LANG.meta.id);
    checkAch(true);
    syncOpts();
    if (had) {
      catchUp();
      if (modalOpen('offline') === false) { if (state.pendingOff > 0) showOffline(0); else if (state.life > 0) say(t('hello.back'), 'happy'); }
    } else { state.last = Date.now(); say(t('hello.new'), 'happy'); }
    lastTier = tierIdx();
    selectTab(state.opt.tab || 'gen');
    selectSub(state.opt.msub || 'train');
    layoutBrain(true);
    updateAll();
    restartTick();
    setInterval(() => { if (!document.hidden) save(); }, 5000);
    scheduleBonus(true);
    blinkLoop();
    if (pendingTier()) setTimeout(openChoice, 600);
  }
  if (location.hash === '#debug') window.__bot = function (taps, pol) {
    pol = pol || {};
    if (modalOpen('story')) $('stOk').click();
    if (choiceOpen) choose(pol.side || 'f');
    if (modalOpen('quiz')) { const b = $('qOpts').querySelector('button'); if (b) b.click(); }
    for (let i = 0; i < taps; i++) collect(null, null, null, false);
    let guard = 0;
    while (mergeLowest(true) && guard++ < 40) { /* birleştir */ }
    const s = freeSlot();
    if (s >= 0 && neuronCost() <= state.data * 0.3) { state.data -= neuronCost(); state.nBought++; state.neurons.push({ s: s, l: 1 }); brainDirty(); }
    UP.filter(u => !state.upg[u.id] && u.ok() && upCost(u) <= state.data).sort((a, b) => a.cost - b.cost).forEach(u => {
      if (upCost(u) <= state.data) { state.data -= upCost(u); state.upg[u.id] = true; state.upgBought++; brainDirty(); }
    });
    for (let k = 0; k < 80; k++) {
      let best = -1, bv = Infinity, bestA = -1, bvA = Infinity;
      const d = Math.max(1e-9, dps());
      G.forEach((g, i) => {
        if (!genBuyable(i)) return;
        const c = costFor(i, 1), v = c / (g.r * srcMult(i));
        if (v < bv) { bv = v; best = i; }
        if (c <= state.data && v < bvA) { bvA = v; bestA = i; }
      });
      if (best < 0) break;
      if (costFor(best, 1) <= state.data) { state.data -= costFor(best, 1); state.gen[best]++; continue; }
      if ((costFor(best, 1) - state.data) / d < 30 || bestA < 0) break;
      state.data -= costFor(bestA, 1); state.gen[bestA]++;
    }
    if (state.syn.length < synCap() && state.neurons.length > 1) {
      const ns = state.neurons.slice().sort((a, b) => b.l - a.l);
      for (let i = 0; i < ns.length && state.syn.length < synCap(); i++) for (let j = i + 1; j < ns.length && state.syn.length < synCap(); j++) {
        if (synIndex(ns[i].s, ns[j].s) < 0) { state.syn.push(synKey(ns[i].s, ns[j].s)); brainDirty(); }
      }
    }
    if (turboReady() && pol.turbo !== false) startTurbo(true);
    const pk = document.querySelector('.packet'); if (pk && pol.packets !== false) pk.click();
    const g = gain();
    if (g >= Math.max(pol.firstPrestige || 5, state.params * (pol.prestigeRatio || 1))) {
      state.params += g; state.chips += 1 + Math.floor(Math.sqrt(g)); state.runs++; resetRun(); return 'prestige:' + g;
    }
    return '';
  };
  if (location.hash === '#debug') window.__tick = tick;
  if (location.hash === '#debug') window.__yz = { state: state, B: B, rebuild: rebuild, updateAll: updateAll, spawnVirus: spawnVirus, openChoice: openChoice, tapValue: tapValue, dps: dps, openQuiz: openQuiz,
    spawnSurprise: spawnSurprise, updateTek: updateTek, tierIdx: tierIdx, gain: gain, catchUp: catchUp, save: save, loadFrom: loadFrom, chEnter: chEnter, chExit: chExit, powerOf: powerOf,
    autoBuy: autoBuy, tick: tick, KEY: KEY, applyLang: applyLang, LANGS: LANGS, t: t, showStory: showStory, postNews: postNews };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => ({ s: JSON.stringify(state) })); } catch (e) { /* yok */ } }
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});

})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
